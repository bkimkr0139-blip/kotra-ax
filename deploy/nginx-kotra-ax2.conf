# nginx alternative. Obtain a certificate first:  sudo certbot certonly --webroot -w /var/www/html -d kotra-ax2.wizbase.ai.kr
server {
    listen 80;
    server_name kotra-ax2.wizbase.ai.kr;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name kotra-ax2.wizbase.ai.kr;
    ssl_certificate     /etc/letsencrypt/live/kotra-ax2.wizbase.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kotra-ax2.wizbase.ai.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # AI answers stream over SSE
        proxy_read_timeout 120s;
    }
}
